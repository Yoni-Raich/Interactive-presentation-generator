<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slide {{ slide_number }}</title>
    <style>
        /* Reset and base styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            line-height: 1.6;
        }

        .slide-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            width: 100%;
            max-width: 1200px;
            min-height: 700px;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        .slide-content {
            flex: 1;
            padding: 60px 80px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        /* Typography */
        h1 {
            font-size: 3.5rem;
            font-weight: 700;
            color: #2c3e50;
            margin-bottom: 2rem;
            line-height: 1.2;
            text-align: center;
        }

        h2 {
            font-size: 2.8rem;
            font-weight: 600;
            color: #34495e;
            margin-bottom: 1.5rem;
            line-height: 1.3;
        }

        h3 {
            font-size: 2.2rem;
            font-weight: 500;
            color: #34495e;
            margin-bottom: 1.2rem;
            line-height: 1.3;
        }

        h4 {
            font-size: 1.8rem;
            font-weight: 500;
            color: #34495e;
            margin-bottom: 1rem;
        }

        p {
            font-size: 1.4rem;
            color: #555;
            margin-bottom: 1.5rem;
            text-align: justify;
        }

        /* Lists */
        ul, ol {
            margin-bottom: 2rem;
            padding-left: 0;
        }

        li {
            font-size: 1.3rem;
            color: #555;
            margin-bottom: 1rem;
            padding-left: 2rem;
            position: relative;
            line-height: 1.5;
        }

        ul li::before {
            content: "▶";
            color: #667eea;
            font-size: 1rem;
            position: absolute;
            left: 0;
            top: 0.2rem;
        }

        ol li {
            counter-increment: item;
        }

        ol li::before {
            content: counter(item) ".";
            color: #667eea;
            font-weight: 600;
            position: absolute;
            left: 0;
            top: 0;
        }

        ol {
            counter-reset: item;
        }

        /* Nested lists */
        ul ul, ol ol, ul ol, ol ul {
            margin-top: 0.5rem;
            margin-bottom: 0.5rem;
            margin-left: 1.5rem;
        }

        ul ul li::before {
            content: "◦";
            color: #95a5a6;
        }

        /* Text formatting */
        strong, b {
            font-weight: 700;
            color: #2c3e50;
        }

        em, i {
            font-style: italic;
            color: #34495e;
        }

        /* Code blocks and inline code */
        code {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 6px;
            padding: 0.2rem 0.4rem;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            font-size: 1.1rem;
            color: #e83e8c;
        }

        pre {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 10px;
            padding: 1.5rem;
            margin: 1.5rem 0;
            overflow-x: auto;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            font-size: 1rem;
            line-height: 1.4;
        }

        pre code {
            background: none;
            border: none;
            padding: 0;
            color: #495057;
        }

        /* Blockquotes */
        blockquote {
            border-left: 4px solid #667eea;
            padding-left: 2rem;
            margin: 2rem 0;
            font-style: italic;
            color: #6c757d;
            background: #f8f9fa;
            padding: 1.5rem 2rem;
            border-radius: 0 10px 10px 0;
        }

        /* Links */
        a {
            color: #667eea;
            text-decoration: none;
            border-bottom: 2px solid transparent;
            transition: border-bottom-color 0.3s ease;
        }

        a:hover {
            border-bottom-color: #667eea;
        }

        /* Tables */
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 2rem 0;
            font-size: 1.2rem;
        }

        th, td {
            padding: 1rem;
            text-align: left;
            border-bottom: 1px solid #dee2e6;
        }

        th {
            background: #f8f9fa;
            font-weight: 600;
            color: #495057;
        }

        /* Slide footer */
        .slide-footer {
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            padding: 20px 80px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
        }

        .slide-number {
            font-size: 1.2rem;
            font-weight: 500;
            opacity: 0.9;
        }

        /* Decorative elements */
        .slide-container::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
        }

        /* Responsive design */
        @media (max-width: 1024px) {
            .slide-content {
                padding: 40px 60px;
            }
            
            .slide-footer {
                padding: 15px 60px;
            }
            
            h1 {
                font-size: 3rem;
            }
            
            h2 {
                font-size: 2.4rem;
            }
            
            h3 {
                font-size: 2rem;
            }
        }

        @media (max-width: 768px) {
            body {
                padding: 10px;
            }
            
            .slide-container {
                min-height: 600px;
                border-radius: 15px;
            }
            
            .slide-content {
                padding: 30px 40px;
            }
            
            .slide-footer {
                padding: 12px 40px;
            }
            
            h1 {
                font-size: 2.5rem;
            }
            
            h2 {
                font-size: 2rem;
            }
            
            h3 {
                font-size: 1.8rem;
            }
            
            p, li {
                font-size: 1.2rem;
            }
        }

        @media (max-width: 480px) {
            .slide-content {
                padding: 20px 30px;
            }
            
            .slide-footer {
                padding: 10px 30px;
            }
            
            h1 {
                font-size: 2rem;
            }
            
            h2 {
                font-size: 1.8rem;
            }
            
            h3 {
                font-size: 1.6rem;
            }
            
            p, li {
                font-size: 1.1rem;
            }
            
            li {
                padding-left: 1.5rem;
            }
        }

        /* Print styles */
        @media print {
            body {
                background: white;
                padding: 0;
            }
            
            .slide-container {
                box-shadow: none;
                border-radius: 0;
                max-width: none;
                width: 100%;
                min-height: auto;
            }
            
            .slide-footer {
                background: #f8f9fa;
                color: #495057;
            }
        }

        /* High contrast mode support */
        @media (prefers-contrast: high) {
            body {
                background: #000;
            }
            
            .slide-container {
                background: #fff;
                border: 2px solid #000;
            }
            
            h1, h2, h3, h4, strong {
                color: #000;
            }
            
            p, li {
                color: #000;
            }
        }

        /* Reduced motion support */
        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="slide-content">
            {{ content|safe }}
        </div>
        <div class="slide-footer">
            <span class="slide-number">Slide {{ slide_number }}</span>
        </div>
    </div>
</body>
</html>
